name: CI

# Igual que en el backend: solo "push" (sus checks aparecen también en el PR de esa rama) y botón manual.
on:
  push:
    branches: ['**']
  workflow_dispatch:

# Cada job es una "stage". "needs" fija el orden:
#   lint ── test ──┬── build (dist/)
#                  └── docker (imagen)
# Cada job arranca en una máquina limpia; la caché de npm evita descargar las dependencias cada vez.
jobs:
  lint:
    name: Lint y formato
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Comprobar el formato (Prettier)
        run: npm run format:check
      - name: Lint (ESLint)
        run: npm run lint

  test:
    name: Tests
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar tests
        run: npm test -- --watch=false

  build:
    name: Compilar
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar para producción
        run: npm run build
      - name: Guardar la aplicación compilada
        uses: actions/upload-artifact@v7
        with:
          name: sales-controller-web
          path: dist/sales-controller-web/browser/
          retention-days: 7

  docker:
    name: Imagen Docker
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Solo comprueba que el Dockerfile construye la imagen; no la publica en ningún registro
      - name: Construir la imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: sales-controller-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
