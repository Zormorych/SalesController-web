<h2 mat-dialog-title>{{ title }}</h2>

<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content class="fields">
    <mat-form-field>
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="name" maxlength="120" cdkFocusInitial />
      @if (form.controls.name.invalid) {
        <mat-error>El nombre es obligatorio</mat-error>
      }
    </mat-form-field>

    <mat-form-field>
      <mat-label>Precio de venta</mat-label>
      <input matInput type="number" formControlName="salePrice" min="0" step="0.01" />
      <span matTextSuffix>€</span>
      @if (form.controls.salePrice.invalid) {
        <mat-error>Indica un precio de 0 o más</mat-error>
      }
    </mat-form-field>

    <mat-form-field>
      <mat-label>Coste</mat-label>
      <input matInput type="number" formControlName="purchaseCost" min="0" step="0.01" />
      <span matTextSuffix>€</span>
      @if (form.controls.purchaseCost.invalid) {
        <mat-error>Indica un coste de 0 o más</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancelar</button>
    <button mat-flat-button type="submit" [disabled]="saving()">Guardar</button>
  </mat-dialog-actions>
</form>
