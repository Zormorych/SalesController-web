<h2 mat-dialog-title>{{ title }}</h2>

<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content class="fields">
    <mat-form-field>
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="name" maxlength="120" cdkFocusInitial />
      @if (form.controls.name.invalid) {
        <mat-error>El nombre es obligatorio</mat-error>
      }
    </mat-form-field>

    <mat-form-field>
      <mat-label>Teléfono de WhatsApp</mat-label>
      <input matInput type="tel" formControlName="phone" placeholder="+34 600 123 456" />
      @if (form.controls.phone.invalid) {
        <mat-error>Escribe un teléfono válido, por ejemplo +34 600 123 456</mat-error>
      }
    </mat-form-field>

    <mat-form-field>
      <mat-label>Notas</mat-label>
      <textarea matInput formControlName="notes" rows="3" maxlength="500"></textarea>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancelar</button>
    <button mat-flat-button type="submit" [disabled]="saving()">Guardar</button>
  </mat-dialog-actions>
</form>
